[package]
name = "can-bench"
version = "0.1.0"
edition = "2021"
description = "CAN analyser terminal and firmware updater for CANable 2.5 (Slcan / Candlelight) adapters"

[[bin]]
name = "can-bench"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
nusb = "0.2"
serialport = "4"
rfd = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = "0.4"
ureq = "3"
serde_json = "1"
egui_plot = "0.38"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1"
rhai = "1.27.0"
toml_edit = "0.25.19"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.release]
opt-level = 3
