# Builds and tests CAN Bench on Windows, Linux and macOS for every push and pull request.
# Pushing a tag like v0.2.0 also creates a GitHub Release with a download for each platform.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: linux-x64
            os: ubuntu-22.04 # older glibc = the binary runs on more distributions
            target: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: ${{ matrix.target }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev

      - name: Test
        # the x86_64 macOS build is cross-compiled on an Apple Silicon runner, so its tests cannot run
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        id: pkg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="dev-${GITHUB_SHA::7}"
          NAME="can-bench-${VERSION}-${{ matrix.name }}"
          OUT="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUT/$NAME"
          BIN="target/${{ matrix.target }}/release/can-bench"
          case "${{ runner.os }}" in
            Windows)
              cp "$BIN.exe" "$OUT/$NAME/"
              cp ../README.md "$OUT/$NAME/"
              (cd "$OUT" && 7z a -tzip "$NAME.zip" "$NAME" > /dev/null)
              echo "file=dist/$NAME.zip" >> "$GITHUB_OUTPUT" ;;
            Linux)
              cp "$BIN" ../README.md ../packaging/linux/99-can-bench.rules "$OUT/$NAME/"
              tar -C "$OUT" -czf "$OUT/$NAME.tar.gz" "$NAME"
              echo "file=dist/$NAME.tar.gz" >> "$GITHUB_OUTPUT" ;;
            macOS)
              APP="$OUT/$NAME/CAN Bench.app"
              mkdir -p "$APP/Contents/MacOS"
              cp "$BIN" "$APP/Contents/MacOS/can-bench"
              sed "s/@VERSION@/${VERSION}/" ../packaging/macos/Info.plist > "$APP/Contents/Info.plist"
              # ad-hoc signature: required to run on Apple Silicon (not a Developer ID / notarisation)
              codesign --force --deep --sign - "$APP"
              cp ../README.md "$OUT/$NAME/"
              (cd "$OUT" && ditto -c -k --keepParent "$NAME" "$NAME.zip")
              echo "file=dist/$NAME.zip" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: can-bench-${{ matrix.name }}
          path: ${{ steps.pkg.outputs.file }}
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "CAN Bench $GITHUB_REF_NAME" --generate-notes
